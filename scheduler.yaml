version: 1
defaults:
  timeout: 600
  max_retries: 3
  retain_runs: 30
jobs:
  daily-ops:
    name: Daily Ops — Summary, Briefing, Actions & Compliance Refresh
    schedule: 30 7 * * 1-5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Daily summary (refreshes calendar, transcripts, agents) ==="
      bun run summarize --today || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Morning briefing (reads fresh DB) ==="
      bun run briefing || { echo "FAILED: briefing"; FAILED=2; }
      echo "=== Action items ==="
      bun run assess-actions || { echo "FAILED: assess-actions"; FAILED=2; }
      echo "=== Compliance refresh (current week Tempo + 5/15 snapshot) ==="
      bun run compliance --fresh || { echo "FAILED: compliance"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 3600
    enabled: true
    tags:
      - daily
      - personalized-helper
  afternoon-sync:
    name: Afternoon Sync — Refresh Meetings (skip agents)
    schedule: 0 15 * * 1-5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Afternoon meeting sync (agents skipped — morning run handled triage) ==="
      bun run summarize --today --skip-agents || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 600
    enabled: true
    tags:
      - daily
      - personalized-helper
  meeting-prep:
    name: Meeting Prep
    schedule: 45 7 * * 1-5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    prompt: |
      Check today's calendar for upcoming meetings, then run the relevant prep scripts:
      - For 1:1 meetings: bun run one-on-one
      - For skip-level meetings: bun run skip-level
      - For other key meetings: bun run prep
      Run each applicable script and report what was generated. If no meetings today, just report that.
      Note: NODE_TLS_REJECT_UNAUTHORIZED=0 should be set for LiteLLM calls.
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - daily
      - personalized-helper
      - meetings
  pre-meeting-prep:
    name: Pre-Meeting Prep — Tomorrow's 1:1s & Skip-Levels
    schedule: 0 17 * * 0-4
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    prompt: |
      Generate prep notes for TOMORROW's important meetings so they're ready first thing.
      Steps:
      1. Look at tomorrow's calendar (date in America/Los_Angeles or local timezone — use whichever the helper DB stores).
      2. For each 1:1 meeting on tomorrow's calendar: run `bun run one-on-one` with the relevant person.
      3. For each skip-level on tomorrow's calendar: run `bun run skip-level`.
      4. For other named recurring meetings (staff, planning, review): run `bun run prep`.
      5. Save each prep file into data/summaries/ with tomorrow's date.
      6. Report what was generated. If tomorrow has no qualifying meetings, just say so.
      Note: NODE_TLS_REJECT_UNAUTHORIZED=0 should be set for LiteLLM calls.
    model: sonnet
    skip_permissions: true
    timeout: 900
    enabled: true
    tags:
      - daily
      - personalized-helper
      - meetings
      - prep
  market-researcher:
    name: Market Research Pipeline
    schedule: 0 12 * * 1,4
    directory: /Users/akorinek/Programming/market-researcher
    type: script
    command: |
      set -e
      npm run cli
      echo "=== Output verification ==="
      echo "Reports:" && ls -lh reports/*.{html,json} 2>/dev/null || echo "(none)"
      echo "Markfiles:" && ls -lh .data/ 2>/dev/null || echo "(none)"
    timeout: 1800
    enabled: true
    tags:
      - periodic
      - twice-weekly
      - market-researcher
  market-researcher-weekly-baselines:
    name: Market Researcher — Weekly Baselines (revenue + funnel + category)
    schedule: 0 7 * * 1
    directory: /Users/akorinek/Programming/market-researcher
    type: script
    command: |
      FAILED=0
      echo "=== Revenue baselines (UNAGI) ==="
      npm run fetch:baselines || { echo "FAILED: fetch:baselines"; FAILED=2; }
      echo "=== Session funnel ==="
      npm run fetch:funnel || { echo "FAILED: fetch:funnel"; FAILED=2; }
      echo "=== Category funnel ==="
      npm run fetch:category-funnel || { echo "FAILED: fetch:category-funnel"; FAILED=2; }
      echo "=== Row counts ==="
      sqlite3 .data/market-researcher.db "SELECT 'revenue_baselines' AS t, COUNT(*) AS rows, MAX(period_end) AS latest FROM revenue_baselines UNION ALL SELECT 'session_funnel_baselines', COUNT(*), MAX(period_end) FROM session_funnel_baselines UNION ALL SELECT 'category_funnel_baselines', COUNT(*), MAX(period_end) FROM category_funnel_baselines;"
      exit $FAILED
    timeout: 1800
    enabled: true
    tags:
      - periodic
      - weekly
      - market-researcher
      - bigquery
  executive-review:
    name: Executive Review — Daily Summary
    schedule: 5 18 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      You are the executive review agent. Review today's scheduled run results and write a summary.

      Read the run data from the data/runs/ directory. For each job that ran today:
      1. Check data/runs/<job-id>/latest/status.json for the status and timing
      2. Check data/runs/<job-id>/latest/output.log for a brief summary of what happened
      3. Flag any failures, timeouts, or errors

      Write a concise executive summary covering:
      - How many jobs ran today, how many succeeded/failed
      - Key outputs or highlights from each successful run
      - Any failures that need attention (with error details)
      - Any jobs that were scheduled but didn't run

      Save the summary to data/daily-summary-$(date +%Y-%m-%d).md
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - daily
      - meta
      - review
  weekly-ops:
    name: Weekly Ops — Summary, Compliance & Decisions
    schedule: 0 7 * * 1
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Weekly summary ==="
      bun run summarize --week || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Compliance check (previous week) ==="
      bun run compliance --fresh || { echo "FAILED: compliance"; FAILED=2; }
      echo "=== Decisions digest ==="
      bun run decisions-digest || { echo "FAILED: decisions-digest"; FAILED=2; }
      echo "=== Person profiles ==="
      bun run profile --all || { echo "FAILED: profile"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 1200
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - decisions
  weekly-515-thu:
    name: My 5/15 Draft — Thursday Early Safety-Net
    schedule: 0 16 * * 4
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Generating Thursday 5/15 draft ==="
      bun run compliance --fresh --with-my-515
      echo "=== Done ==="
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-515-fri:
    name: My 5/15 Draft — Friday Multi-Pass (11/14/17)
    schedule: 0 11,14,17 * * 5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Regenerating Friday 5/15 draft ==="
      bun run compliance --fresh --with-my-515
      echo "=== Done ==="
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-515-mon:
    name: My 5/15 Draft — Monday Settled-SEO Backfill
    schedule: 0 8 * * 1
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # UNAGI settles SEO 3.3 revenue ~2 days after week-end, so the Thu/Fri
      # passes always omit it. Regenerate the just-completed (now-settled) week
      # on Monday so the SEO business-impact line lands. Targets the most recent
      # Friday that is at least 2 days old (settled).
      LAST_FRI=""
      for i in 2 3 4 5 6 7 8; do
        if [ "$(date -v-${i}d +%u)" = "5" ]; then LAST_FRI=$(date -v-${i}d +%F); break; fi
      done
      echo "=== Backfilling settled 5/15 for week ending $LAST_FRI ==="
      bun run generate-515 --week "$LAST_FRI"
      echo "=== Done ==="
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  compliance-check:
    name: Compliance Check — Fri/Sat/Sun
    schedule: 0 9,15,21 * * 5,6,0
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Team compliance check ==="
      bun run compliance --fresh
      echo "=== Done ==="
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - compliance
  skill-healer:
    name: Skill Healer — Weekly Improvement
    schedule: 0 3 * * 0
    directory: /Users/akorinek/Programming
    prompt: |
      Process accumulated session signals and improve Claude Code skills:
      1. Read ~/.claude/self-heal/signals.jsonl for accumulated session signals
      2. Analyze patterns: user corrections, tool failures, unused skills
      3. For HIGH-confidence improvements, apply changes to the relevant skill .md files in ~/.claude/skills/
      4. For lower-confidence findings, just report them
      5. After processing, truncate the signals file to prevent reprocessing
      Report what signals were found and what changes were made.
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - weekly
      - skills
      - meta
  eod-report:
    name: EOD Report — End of Day Update
    schedule: 0 18 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      Read the skill file at ~/.claude/skills/daily-reporting/SKILL.md and follow it exactly.
      Run in autonomous mode (--auto): skip all interactive prompts, infer from git activity, and post directly.
    model: sonnet
    skip_permissions: true
    timeout: 300
    enabled: false
    tags:
      - daily
      - eod
      - reporting
  babysit-prs:
    name: Babysit PRs — Auto-Review Open PRs
    schedule: 0 6,8,10,12,14,16,18,20,22 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      Review open PRs on configured repos. For each PR that needs review,
      read and follow ~/.claude/skills/pr-review/SKILL.md exactly.

      ## Repos to check — with host-specific "my username" pinned per repo
      - groupon/echelon (github.com) — my username: akorinek-grpn — all open PRs
      - Mobile-Next/next-pwa-app (github.groupondev.com) — my username: akorinek — only PRs with label "SEO"

      ## CRITICAL: host → username mapping
      | Host | My username | Self-review filter (author login to skip) | Prior-review filter (reviewer login) |
      |---|---|---|---|
      | github.com | akorinek-grpn | akorinek-grpn | akorinek-grpn |
      | github.groupondev.com | akorinek | akorinek | akorinek |

      These are DIFFERENT accounts. Using the wrong one returns zero hits from the reviews API
      and causes duplicate reviews on the same HEAD commit (this happened to
      groupon/echelon PR #285 on 2026-04-16 — two reviews 8h apart on the same SHA).
      For every `select(.user.login == "<X>")` filter you construct, pick `<X>` from the
      table above based on which host the repo lives on. Do not rely on config.json's
      single `github_username` field (that's the GHE one only).

      ## For each repo above:
      1. List open, non-draft PRs:
         - For github.com repos:
           ```
           gh pr list --repo <repo> --state open --json number,title,author,createdAt,isDraft,labels --limit 10
           ```
         - For GHE repos (github.groupondev.com):
           ```
           GH_HOST=github.groupondev.com gh pr list --repo <repo> --state open --json number,title,author,createdAt,isDraft,labels --limit 10
           ```
      2. Filter out drafts and PRs authored by ME (self-review filter from the table
         above — use `akorinek-grpn` on github.com, `akorinek` on github.groupondev.com).
      3. If the repo has a label filter (e.g., "SEO"), additionally filter to only PRs that have that label.
      4. For each remaining PR (oldest first), decide whether to review.

         a. Fetch my FULL review history on this PR (not just last review) — USING THE
            HOST-CORRECT USERNAME from the table. We need the full array because an
            earlier approval must stick even if later runs flipped the state:
            ```
            # github.com example:
            gh api repos/<repo>/pulls/<number>/reviews --jq '[.[] | select(.user.login == "akorinek-grpn")] | sort_by(.submitted_at) | map({state, submitted_at, commit_id: .commit_id[0:8]})'
            # GHE example:
            GH_HOST=github.groupondev.com gh api repos/<repo>/pulls/<number>/reviews --jq '[.[] | select(.user.login == "akorinek")] | sort_by(.submitted_at) | map({state, submitted_at, commit_id: .commit_id[0:8]})'
            ```
            From that array, compute three values:
            - `ever_approved`: `true` if ANY review has state == "APPROVED".
            - `latest`: the last element (most recent review), or null if the array is empty.
            - `latest_state`, `latest_commit`, `latest_age_hours`: fields of `latest`.

         b. Get the current HEAD SHA:
            ```
            gh pr view <number> --repo <repo> --json headRefOid --jq '.headRefOid'
            ```

         c. Decision ladder — evaluate in this order and take the FIRST match:
            1. **`ever_approved == true`** → **skip** ("already approved by this account —
               once we've approved a PR, we do NOT review it again, even if new commits
               land. Human reviewers take over from there."). This is an **unconditional
               terminal state** — it overrides cooldown, HEAD-change, and re-review rules.
               If the author pushes destructive changes after our approval, they need a
               human reviewer anyway, not another bot pass.
            2. **No prior review** → **review this PR** (first-time).
            3. **Head SHA == latest.commit_id** → **skip** ("already reviewed at current HEAD,
               no new commits").
            4. **Head SHA != latest.commit_id AND latest_age_hours < 4** → **skip** with
               reason "cooldown (Nh ago, reviewing again at T+4h)". Computes age with
               `(now - submitted_at_iso) / 3600`. Prevents tight re-review loops on
               rapidly-churning branches.
            5. **Head SHA != latest.commit_id AND latest_age_hours ≥ 4** → **re-review**
               (new commits, cooldown passed, not previously approved).

         d. ALWAYS log the decision line, even on skip — so drift is debuggable:
            ```
            PR <repo>#<n>: head=<sha8> prior=<sha8> ever_approved=<true|false> latest_state=<S> age=<Xh> decision=<skip|review|re-review> reason=<"approved"|"same-HEAD"|"cooldown"|"new-commits"|"first-time">
            ```

         For GHE repos, prefix all gh commands with GH_HOST=github.groupondev.com.
      5. For PRs that need review:
         a. Read ~/.claude/skills/pr-review/SKILL.md
         b. Follow ALL steps in that skill file with --auto flag behavior:
            - Steps 1-6: fetch PR, filter files, understand intent, deep review, build findings
            - Step 7: generate the review summary with verdict
            - Step 8: POST THE REVIEW VIA `gh api ... /reviews` with the STRICT INLINE CONTRACT below.
            - Auto-approve logic (--auto mode):
              * 0 critical + 0 important findings → event: "APPROVE"
              * 0 critical + 1+ important → event: "COMMENT"
              * 1+ critical → event: "REQUEST_CHANGES"
            - Re-review: if prior review exists, diff only new commits and don't duplicate prior comments

         ## STRICT INLINE-COMMENT CONTRACT

         The biggest historical failure mode of this job is posting reviews with
         `"comments": []` and dumping every finding into the `body` as prose.
         That produces a wall-of-text review with nothing tagged to actual code,
         which is useless. You MUST NOT do this. Rules:

         1. **Every finding that references a specific file or code location MUST
            be an inline comment**, not a `body` bullet. A finding like
            "in `queries/teams.ts` line ~3796 the query uses COUNT where users uses
            SUM" → inline comment on that file at a line near that finding. A
            finding like "PR is missing a CHANGELOG entry" has no code location →
            that one may stay in `body` under "### Process".

         2. **The `body` field is short and structural**, containing ONLY:
            - Verdict line ("Comment" / "Approve" / "Request Changes")
            - Scope line (files, +added/-removed)
            - Risk line (Low/Medium/High + 1-sentence why)
            - "### Summary" — 1-2 sentences on what the PR does
            - "### Strengths" — 2-4 bullet praise lines
            - "### Issues Found" — counts per severity ONLY (e.g., "2 critical, 3 important, 1 minor"). NO finding bodies here.
            - Optional "### Process" for things with no code location
            Target: body length under ~2500 characters. If it's longer, you're
            putting finding details in the body — move them inline.

         3. **Before calling `gh api`, self-validate the payload**:
            - If `comments.length == 0` AND there's any finding that mentions a
              file path → you made the mistake above. STOP, reconstruct, and move
              those findings into `comments` with valid line numbers. Do NOT post.
            - If `body` contains `[Critical]`, `[Important]`, or `[Minor]` headers
              followed by multi-line detail → same mistake. Move the detail into
              inline `comments` and leave only the severity count in the body.

         4. **How to pick a valid line number** (this is where people fail and then
            give up and stuff everything into the body — don't):
            a. Get the diff with hunks: `gh pr diff <N> --repo <repo>` (or
               `GH_HOST=... gh pr diff ...` on GHE).
            b. Each file block has `@@ -a,b +c,d @@` hunk headers. The `+c,d` part
               tells you that the new file's hunk starts at line `c` and spans `d`
               lines. ANY line from `c` to `c+d-1` is legal for `side: "RIGHT"`.
            c. For brand-new files, the diff header is `@@ -0,0 +1,N @@` — any
               line 1..N is legal.
            d. For multi-line annotations, `start_line` and `line` must both sit
               inside the SAME hunk on the same side.
            e. Prefer lines that are additions (`+` prefix in the diff). Context
               lines (space prefix) within a hunk also work.
            f. If you can't pin the finding to one exact line, pick the nearest
               `+` line in that file's hunks. A comment near the code beats a
               comment buried in prose.

         5. **Comment body format** — each inline comment body begins with a
            severity prefix and may include a GitHub `suggestion` block for
            concrete fixes:
            ```
            **[Critical]** <one-sentence summary>

            <1-3 sentences explaining why it matters>

            ```suggestion
            <corrected code>
            ```
            ```

         6. **Posting mechanics**:
            - HEAD SHA: `gh pr view <N> --repo <repo> --json headRefOid --jq '.headRefOid'`
            - Write payload to `/tmp/pr-<N>-review.json` via `cat > ... << 'EOF'`
            - Post with: `gh api repos/<repo>/pulls/<N>/reviews --method POST --input /tmp/pr-<N>-review.json`
            - On GHE, prefix with `GH_HOST=github.groupondev.com`.

         7. **On 422 error** ("Pull request review thread line must be part of the
            diff"): the ONLY correct response is to pick a different line that IS
            in the diff. DO NOT fall back to posting a review with
            `comments: []` and all findings in the body. If 2-3 attempts fail on
            the same finding, drop THAT finding entirely (log it to stdout) and
            post the remaining inline comments. A review with 3 of 5 inline is
            still better than a review with 0 inline.

         8. **Self-audit log line** after posting: print
            `POSTED <repo>#<N>: body_len=<X> inline_comments=<Y> event=<E>`.
            If Y == 0 and there were file-specific findings, that's a bug — surface
            it in the final summary so it's visible.

      6. After processing all repos, print a summary:
         - PRs reviewed (first time): [list with numbers and titles, inline_comments count]
         - PRs re-reviewed (new commits): [list with inline_comments count]
         - PRs skipped (already approved by this account): [list with reason]
         - PRs skipped (up to date at HEAD): [list]
         - PRs skipped (cooldown): [list with hours remaining]
         - PRs skipped (draft/self-authored): [list]
         - **Any review posted with 0 inline comments and file-specific findings**: flag as bug

      ## Important
      - ALWAYS post via gh api with inline comments — never just print the review to stdout
      - ALWAYS use the approve/comment/request-changes logic based on finding severity
      - If the 422-retry loop exhausts, drop the specific finding rather than collapsing to a body-only review
      - If a PR review fails entirely, log the error and continue to the next one
      - If there are no PRs to review, just report "No unreviewed PRs found"
    model: sonnet
    skip_permissions: true
    timeout: 1500
    enabled: true
    tags:
      - periodic
      - pr-review
      - echelon
      - next-pwa-app
      - seo
  ai-researcher:
    name: AI Researcher — Run Analysis & Improvement Proposals
    schedule: 0 5 * * 0
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      You are the AI Researcher agent for the ai-scheduler platform. Your job is to analyze
      all recent run data and propose concrete improvements to both the scheduled jobs and
      the skills they invoke.

      ## Step 1 — Gather run data

      Read scheduler.yaml to understand all configured jobs.
      Then scan data/runs/ for every job. For each job directory:
        - List all run directories (skip "latest" symlinks)
        - Read status.json and meta.json from each run
        - Read eval.json if present (contains AI evaluation of the run)
        - Sample the output.log from the most recent 3 runs (first 100 + last 100 lines each)

      ## Step 2 — Compute metrics

      For each job, calculate:
        - Total runs in the last 7 days
        - Success rate (success / total)
        - Average duration (finishedAt - startedAt)
        - Failure patterns: group failures by exit code or error message
        - Timeout rate
        - Runs with follow-up needed (from eval.json)

      ## Step 3 — Analyze patterns

      Look for:
        - Jobs with success rate below 80% — what's going wrong?
        - Jobs that consistently timeout — should the timeout be increased, or is the task too broad?
        - Jobs where the output log shows the AI going off-track (not following the skill, doing unnecessary work)
        - Script jobs that could benefit from better error handling
        - Claude jobs that would be better as scripts (just running commands, no AI reasoning needed)
        - Claude jobs where the prompt is too vague or the skill reference isn't being followed
        - Recurring errors across multiple jobs (e.g., auth issues, missing dependencies, network failures)

      ## Step 4 — Propose improvements

      For each finding, write a concrete proposal:

        ### [Job ID]: [Brief issue title]
        **Severity:** low | medium | high | critical
        **Category:** prompt-quality | skill-gap | timeout | error-handling | type-mismatch | config
        **Current behavior:** [what's happening]
        **Proposed change:** [specific fix — include the exact config/prompt/skill change]
        **Expected impact:** [what improves]

      ## Step 5 — Check skills

      For any claude job that references a skill file:
        - Read the skill file
        - Compare what the skill says to do vs. what the run logs show actually happened
        - Flag gaps where the skill instructions are being ignored or misinterpreted
        - Propose skill edits if the instructions are ambiguous

      ## Step 6 — Write TWO files

      Save BOTH of these to data/research/ (create the directory if missing):

      ### A) data/research/YYYY-MM-DD-analysis.md
      Human-readable report with:
        - Executive summary (3-5 bullet points)
        - Metrics table (job, runs, success rate, avg duration)
        - Detailed findings with proposals
        - A prioritized action list (what to fix first)

      ### B) data/research/YYYY-MM-DD-findings.json
      Structured findings consumed by the web UI dashboard. STRICT SCHEMA:
      ```json
      {
        "date": "YYYY-MM-DD",
        "generatedAt": "<ISO 8601 timestamp>",
        "summary": "<one sentence, e.g. '3 critical, 2 medium, 1 low'>",
        "totals": { "critical": 0, "high": 0, "medium": 0, "low": 0 },
        "findings": [
          {
            "id": "<kebab-case slug, unique within this report>",
            "severity": "critical" | "high" | "medium" | "low",
            "category": "prompt-quality" | "skill-gap" | "timeout" | "error-handling" | "type-mismatch" | "config",
            "jobId": "<job id this affects, or omit if cross-cutting>",
            "title": "<short title, < 80 chars>",
            "currentBehavior": "<what's happening today, 1-2 sentences>",
            "proposal": "<specific fix, 1-3 sentences>",
            "expectedImpact": "<what improves, 1 sentence>"
          }
        ]
      }
      ```
      Rules for the JSON file:
        - It MUST be valid JSON (validate before writing — no trailing commas, no comments).
        - `totals` MUST match the count of `findings` by severity (used for the dashboard badges).
        - `id` slugs must be unique and stable enough that the markdown can link to `#<id>` anchors.
        - Match each finding in this JSON to a corresponding section in the markdown report.

      Do NOT make any changes to code, config, or skills. Report only — these two files
      are the entire output. The web UI at /research surfaces them on the dashboard.
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - weekly
      - meta
      - research
  setup-health:
    name: Setup Health Audit — Weekly ~/.claude Rot Check
    schedule: 0 9 * * 1
    directory: /Users/akorinek/Programming
    prompt: |
