version: 1
defaults:
  timeout: 600
  max_retries: 1
  retain_runs: 30
jobs:
  daily-ops:
    name: Daily Ops — Summary, Briefing, Actions & Compliance Refresh
    schedule: 5 9 * * 1-5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Daily summary (refreshes calendar, transcripts, agents) ==="
      bun run summarize --today || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Morning briefing (reads fresh DB) ==="
      bun run briefing || { echo "FAILED: briefing"; FAILED=2; }
      echo "=== Action items ==="
      bun run assess-actions || { echo "FAILED: assess-actions"; FAILED=2; }
      echo "=== Compliance refresh (current week Tempo + 5/15 snapshot) ==="
      bun run compliance --fresh || { echo "FAILED: compliance"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 3600
    enabled: true
    tags:
      - daily
      - personalized-helper
  afternoon-sync:
    name: Afternoon Sync — Refresh Meetings (skip agents)
    schedule: 0 15 * * 1-5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Afternoon meeting sync (agents skipped — morning run handled triage) ==="
      bun run summarize --today --skip-agents || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 600
    enabled: true
    tags:
      - daily
      - personalized-helper
  meeting-prep:
    name: Meeting Prep — 1:1 Agendas Due (morning catch-up)
    schedule: 20 9 * * 1-5
    catchup: same-day # works on "today"/"tomorrow": a next-day catch-up would do the wrong day
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # Writes a 1:1 agenda for each direct whose usual 1:1 cadence (from the
      # Fireflies history) says they are due - no calendar needed. This was a
      # Claude job that started with "check today's calendar"; Google Calendar
      # is not connected, so it reported success while producing nothing.
      # Catches anyone the 17:00 pre-meeting pass missed (machine asleep);
      # otherwise a no-op, since a fresh agenda blocks regeneration for one
      # cadence. Recurring-meeting prep runs inside daily-ops (summarize) at 09:05.
      echo "=== 1:1 agendas due ==="
      bun run one-on-one --due
      RC=$?
      echo "=== Done ==="
      exit $RC
    # The first run after the switch clears a backlog (6 directs due on
    # 2026-09-29, ~2-4 min each); later runs touch one or two.
    timeout: 2400
    enabled: true
    tags:
      - daily
      - personalized-helper
      - meetings
  pre-meeting-prep:
    name: Pre-Meeting Prep — 1:1 Agendas Due Tomorrow
    schedule: 0 17 * * 0-4
    catchup: same-day # works on "today"/"tomorrow": a next-day catch-up would do the wrong day
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # The evening pass: a direct becomes due one day before their usual
      # cadence lands, so tomorrow's 1:1 agendas are ready first thing. Same
      # deterministic script as meeting-prep (was a calendar-driven Claude job).
      # Skip-level and calendar-based prep (bun run skip-level / prep) need the
      # calendar and are run by hand until it is connected.
      echo "=== 1:1 agendas due ==="
      bun run one-on-one --due
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 2400
    enabled: true
    tags:
      - daily
      - personalized-helper
      - meetings
      - prep
  market-researcher:
    name: Market Research Pipeline
    schedule: 0 12 * * 1,4
    directory: /Users/akorinek/Programming/market-researcher
    type: script
    command: |
      set -e
      npm run cli
      echo "=== Output verification ==="
      echo "Reports:" && ls -lh reports/*.{html,json} 2>/dev/null || echo "(none)"
      echo "Markfiles:" && ls -lh .data/ 2>/dev/null || echo "(none)"
    # 1800s was tuned when every LLM call failed fast against the LiteLLM auth
    # gate. On the Anthropic API the pipeline does real work (grounded web
    # search + per-stage LLM analysis) and needs ~35 min end to end.
    timeout: 3600
    enabled: true
    tags:
      - periodic
      - twice-weekly
      - market-researcher
  market-researcher-weekly-baselines:
    name: Market Researcher — Weekly Baselines (revenue + funnel + category)
    # 10:15 Monday: the laptop is usually asleep or offline before ~09:00 (the
    # old 06:00 slot missed 2 of 4 Mondays in Sept 2026). This runs after
    # weekly-ops (Mon 09:30) and well before market-researcher (Mon 12:00),
    # which reads these baseline tables.
    schedule: 15 10 * * 1
    directory: /Users/akorinek/Programming/market-researcher
    type: script
    command: |
      FAILED=0
      echo "=== Revenue baselines (UNAGI) ==="
      npm run fetch:baselines || { echo "FAILED: fetch:baselines"; FAILED=2; }
      echo "=== Session funnel ==="
      npm run fetch:funnel || { echo "FAILED: fetch:funnel"; FAILED=2; }
      echo "=== Category funnel ==="
      npm run fetch:category-funnel || { echo "FAILED: fetch:category-funnel"; FAILED=2; }
      echo "=== Row counts ==="
      sqlite3 .data/market-researcher.db "SELECT 'revenue_baselines' AS t, COUNT(*) AS rows, MAX(period_end) AS latest FROM revenue_baselines UNION ALL SELECT 'session_funnel_baselines', COUNT(*), MAX(period_end) FROM session_funnel_baselines UNION ALL SELECT 'category_funnel_baselines', COUNT(*), MAX(period_end) FROM category_funnel_baselines;"
      exit $FAILED
    timeout: 1800
    enabled: true
    tags:
      - periodic
      - weekly
      - market-researcher
      - bigquery
  executive-review:
    name: Executive Review — Daily Summary
    schedule: 45 16 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      You are the executive review agent. Review today's scheduled run results and write a summary.

      Read the run data from the data/runs/ directory. For each job that ran today:
      1. Check data/runs/<job-id>/latest/status.json for the status and timing
      2. Check data/runs/<job-id>/latest/output.log for a brief summary of what happened
      3. Flag any failures, timeouts, or errors

      Write a concise executive summary covering:
      - How many jobs ran today, how many succeeded/failed
      - Key outputs or highlights from each successful run
      - Any failures that need attention (with error details)
      - Any jobs that were scheduled but didn't run

      Save the summary to data/daily-summary-$(date +%Y-%m-%d).md
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - daily
      - meta
      - review
  weekly-ops:
    name: Weekly Ops — Summary, Compliance & Decisions
    schedule: 30 9 * * 1
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      FAILED=0
      echo "=== Weekly summary ==="
      bun run summarize --week || { echo "FAILED: summarize"; FAILED=2; }
      echo "=== Compliance check (previous week) ==="
      bun run compliance --fresh || { echo "FAILED: compliance"; FAILED=2; }
      echo "=== Decisions digest ==="
      bun run decisions-digest || { echo "FAILED: decisions-digest"; FAILED=2; }
      echo "=== Person profiles ==="
      bun run profile --all || { echo "FAILED: profile"; FAILED=2; }
      echo "=== Done ==="
      exit $FAILED
    timeout: 2400
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - decisions
  weekly-515-thu:
    name: My 5/15 Draft — Thursday Early Safety-Net
    schedule: 0 16 * * 4
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Generating Thursday 5/15 draft ==="
      bun run compliance --fresh --with-my-515
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 1500
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-515-fri:
    name: My 5/15 Draft — Friday Multi-Pass (11/14/17)
    schedule: 0 11,14,17 * * 5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Regenerating Friday 5/15 draft ==="
      bun run compliance --fresh --with-my-515
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 1500
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-515-mon:
    name: My 5/15 Draft — Monday Settled-SEO Backfill
    schedule: 45 9 * * 1
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # UNAGI settles SEO 3.3 revenue ~2 days after week-end, so the Thu/Fri
      # passes always omit it. Regenerate the just-completed (now-settled) week
      # on Monday so the SEO business-impact line lands. Targets the most recent
      # Friday that is at least 2 days old (settled).
      LAST_FRI=""
      for i in 2 3 4 5 6 7 8; do
        if [ "$(date -v-${i}d +%u)" = "5" ]; then LAST_FRI=$(date -v-${i}d +%F); break; fi
      done
      echo "=== Backfilling settled 5/15 for week ending $LAST_FRI ==="
      bun run generate-515 --week "$LAST_FRI"
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 1500
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-515-coaching:
    name: 5/15 Coaching Drafts - Mon Review Queue (Tue safety-net)
    schedule: 0 10 * * 1,2
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # Reads the directs' 5/15s and queues one draft comment per direct for
      # review. POSTS NOTHING: every draft waits on
      # http://localhost:3847/five-fifteens/review for Adam to read, edit, send.
      #
      # Runs Monday AND Tuesday 10:00. The Tuesday pass is a safety-net: if
      # Monday failed (LiteLLM/Asana down, machine asleep) it fills the queue a
      # day late instead of leaving a whole week with no drafts. When Monday
      # succeeded, Tuesday is a no-op - insertDraftIfAbsent skips any (person,
      # week) that already has a row in ANY status (pending/posted/dismissed),
      # so an edited or dismissed draft is never clobbered or resurrected.
      echo "=== Drafting 5/15 coaching comments ==="
      bun run coach-515
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - five-fifteen
  weekly-self-coach:
    name: Self-Coach - Friday Check-in for /me
    schedule: 30 16 * * 5
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      # Builds Adam's weekly ledger (commitment follow-through, coaching
      # cadence, attribution, ticket traceability, talk share, maker ratio),
      # drafts the coach check-in, and appends it for http://localhost:3847/me.
      # Writes ONLY to the local DB - no Asana, no email, no chat. Runs after
      # afternoon-sync (15:00) so transcripts and the week's 5/15 are cached.
      echo "=== Weekly self-coach ==="
      bun run coach-me
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - self-coach
  compliance-check:
    name: Compliance Check — Fri/Sat/Sun
    schedule: 0 9,15,21 * * 5,6,0
    directory: /Users/akorinek/Programming/personalized-helper/personalized-helper
    type: script
    command: |
      echo "=== Team compliance check ==="
      bun run compliance --fresh
      RC=$?
      echo "=== Done ==="
      exit $RC
    timeout: 900
    enabled: true
    tags:
      - weekly
      - personalized-helper
      - compliance
  skill-healer:
    name: Skill Healer — Weekly Improvement
    schedule: 0 16 * * 5
    directory: /Users/akorinek/Programming
    prompt: |
      Process accumulated session signals and improve Claude Code skills:
      1. Read ~/.claude/self-heal/signals.jsonl for accumulated session signals
      2. Analyze patterns: user corrections, tool failures, unused skills
      3. For HIGH-confidence improvements, apply changes to the relevant skill .md files in ~/.claude/skills/
      4. For lower-confidence findings, just report them
      5. After processing, truncate the signals file to prevent reprocessing
      Report what signals were found and what changes were made.
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - weekly
      - skills
      - meta
  babysit-prs:
    name: Babysit PRs — Auto-Review Open PRs
    schedule: 0 6-22 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      ## FIRST, BEFORE ANYTHING ELSE: check the autopilot-daily lock

      Run: `cat ~/.autopilot-daily.lock 2>/dev/null`

      If that file exists AND its `startedAt` epoch-milliseconds value is less
      than 120 minutes old, the autopilot-daily job is mid-run and holds the
      machine. In that case print exactly:
        "Deferred - autopilot-daily holds the lock"
      and STOP immediately. Do not review any PRs, do not call any other tool.
      You will run again next hour.

      If the file is absent, unparseable, or older than 120 minutes, ignore it and
      proceed normally with the review work below.

      ## Normal review work

      STEP 1 - run the deterministic preflight gate. Your FIRST action is:

        bash ~/.claude/skills/pr-review/scripts/batch-preflight.sh --role review

      It performs per-host auth checks, PR discovery, the full decision ladder,
      budget selection, and writes the batch decision telemetry itself. `--role review`
      keeps first-time, requested and new-commits candidates for this job; a
      `converged` / `converged-static` candidate NEVER appears here - the approve-prs
      job (opus) owns it, and only that job may post APPROVE on a converged PR. While
      the skill's scheduled_mode.scope is on, every candidate carries the SEO label or
      is a PR by the Echelon team on which my review was requested (rule D2), whatever
      its via (config, reach, requested, label); a team PR nobody requested is skipped
      `not-requested` and never becomes a candidate. Read its
      "PREFLIGHT_CANDIDATES:" line, and take the candidates from the file named on its
      "PREFLIGHT_RESULT_FILE:" line (jq '.candidates' FILE) - never from the
      "PREFLIGHT_RESULT_JSON:" line, which the tool output truncates at ~2,000 chars:

      - candidates EMPTY (PREFLIGHT_CANDIDATES: 0) -> print the script's decision
        lines and summary as your run output and STOP. Do NOT read SKILL.md, do NOT
        call any other tool. This is the expected outcome of most runs.
      - candidates NON-EMPTY -> proceed to STEP 2 for exactly those PRs. Pass each
        candidate's author_in_team to the gate exactly as the file gives it, and post
        exactly the posted_event the gate returns, whatever your verdict.
      - exit code 2 -> a host was unreachable/unauthenticated. Say WHICH host
        prominently in your summary (this must never look like "no PRs found"),
        then still process any candidates that were emitted.
      - a SCOPE_STATUS line other than ok / refreshed (stale, unavailable) -> say so
        prominently in your summary: the team roster from Echelon could not be
        refreshed, and with `unavailable` no PR qualified by team this run.

      STEP 2 - review the preflight candidates by following
      ~/.claude/skills/pr-review/SKILL.md EXACTLY, in scheduled/batch mode with
      --auto behavior, starting at Step 0.5 (discovery and the decision ladder
      already ran in preflight - do not re-derive or second-guess skip
      decisions). The skill is the single source of truth for: the trivial-delta
      fast path, pagination discipline (--paginate on every reviews/comments
      list call), the posting contract (inline comments, short structural body,
      422 re-anchor rules), the auto-approve confidence gate, and telemetry
      (schema v2 per-PR files AND appending to the {date}-batch.json runs[]
      decision log). Repos, label filters, and cooldown come from the skill's
      config.json (scheduled_mode section).

      ## CRITICAL: host -> username mapping (identity only; all logic lives in the skill)
      | Host | My username (self-review filter AND prior-review filter) |
      |---|---|
      | github.com | akorinek-grpn |
      | github.groupondev.com | akorinek |

      These are DIFFERENT accounts. For every `select(.user.login == ...)` filter,
      pick the login from this table by the repo's host. Using the wrong one
      silently returns zero hits and causes duplicate reviews on the same HEAD
      (groupon/echelon#285, 2026-04-16).

      ## Job-runner specifics (things the skill does not cover)
      - If a github.groupondev.com call fails to connect, retry once after 15s.
        Still failing: log "GHE unreachable - skipped <repo>" in the summary and
        continue with the remaining repos; do NOT fail the whole run.
      - Do not invoke unrelated skills (hello, session bootstrap, reporting,
        etc.) - go straight to the review work.
      - If a single PR review fails, log the error and continue to the next PR.
      - If there are no PRs to review, report "No unreviewed PRs found".
      - ALWAYS print the per-PR decision lines and the batch summary table from
        the skill's batch-mode section, even when everything is skipped.
    model: sonnet
    skip_permissions: true
    # 1500s killed real review batches mid-flight (comments already posted).
    # Hourly schedule + no-overlap guard bound the cost of a long run anyway.
    timeout: 3600
    max_retries: 0 # hourly: the next run covers a failure; immediate retries only repeat an outage
    enabled: true
    tags:
      - periodic
      - pr-review
      - echelon
      - next-pwa-app
      - lpapi
      - hub-tools
      - seo
  ai-researcher:
    name: AI Researcher — Run Analysis & Improvement Proposals
    schedule: 30 15 * * 5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      You are the AI Researcher agent for the ai-scheduler platform. Your job is to analyze
      all recent run data and propose concrete improvements to both the scheduled jobs and
      the skills they invoke.

      ## Step 1 — Gather run data

      Read scheduler.yaml to understand all configured jobs.
      Then scan data/runs/ for every job. For each job directory:
        - List all run directories (skip "latest" symlinks)
        - Read status.json and meta.json from each run
        - Read eval.json if present (contains AI evaluation of the run)
        - Sample the output.log from the most recent 3 runs (first 100 + last 100 lines each)

      ## Step 2 — Compute metrics

      For each job, calculate:
        - Total runs in the last 7 days
        - Success rate (success / total)
        - Average duration (finishedAt - startedAt)
        - Failure patterns: group failures by exit code or error message
        - Timeout rate
        - Runs with follow-up needed (from eval.json)

      ## Step 3 — Analyze patterns

      Look for:
        - Jobs with success rate below 80% — what's going wrong?
        - Jobs that consistently timeout — should the timeout be increased, or is the task too broad?
        - Jobs where the output log shows the AI going off-track (not following the skill, doing unnecessary work)
        - Script jobs that could benefit from better error handling
        - Claude jobs that would be better as scripts (just running commands, no AI reasoning needed)
        - Claude jobs where the prompt is too vague or the skill reference isn't being followed
        - Recurring errors across multiple jobs (e.g., auth issues, missing dependencies, network failures)

      ## Step 4 — Propose improvements

      For each finding, write a concrete proposal:

        ### [Job ID]: [Brief issue title]
        **Severity:** low | medium | high | critical
        **Category:** prompt-quality | skill-gap | timeout | error-handling | type-mismatch | config
        **Current behavior:** [what's happening]
        **Proposed change:** [specific fix — include the exact config/prompt/skill change]
        **Expected impact:** [what improves]

      ## Step 5 — Check skills

      For any claude job that references a skill file:
        - Read the skill file
        - Compare what the skill says to do vs. what the run logs show actually happened
        - Flag gaps where the skill instructions are being ignored or misinterpreted
        - Propose skill edits if the instructions are ambiguous

      ## Step 6 — Write TWO files

      Save BOTH of these to data/research/ (create the directory if missing):

      ### A) data/research/YYYY-MM-DD-analysis.md
      Human-readable report with:
        - Executive summary (3-5 bullet points)
        - Metrics table (job, runs, success rate, avg duration)
        - Detailed findings with proposals
        - A prioritized action list (what to fix first)

      ### B) data/research/YYYY-MM-DD-findings.json
      Structured findings consumed by the web UI dashboard. STRICT SCHEMA:
      ```json
      {
        "date": "YYYY-MM-DD",
        "generatedAt": "<ISO 8601 timestamp>",
        "summary": "<one sentence, e.g. '3 critical, 2 medium, 1 low'>",
        "totals": { "critical": 0, "high": 0, "medium": 0, "low": 0 },
        "findings": [
          {
            "id": "<kebab-case slug, unique within this report>",
            "severity": "critical" | "high" | "medium" | "low",
            "category": "prompt-quality" | "skill-gap" | "timeout" | "error-handling" | "type-mismatch" | "config",
            "jobId": "<job id this affects, or omit if cross-cutting>",
            "title": "<short title, < 80 chars>",
            "currentBehavior": "<what's happening today, 1-2 sentences>",
            "proposal": "<specific fix, 1-3 sentences>",
            "expectedImpact": "<what improves, 1 sentence>"
          }
        ]
      }
      ```
      Rules for the JSON file:
        - It MUST be valid JSON (validate before writing — no trailing commas, no comments).
        - `totals` MUST match the count of `findings` by severity (used for the dashboard badges).
        - `id` slugs must be unique and stable enough that the markdown can link to `#<id>` anchors.
        - Match each finding in this JSON to a corresponding section in the markdown report.

      Do NOT make any changes to code, config, or skills. Report only — these two files
      are the entire output. The web UI at /research surfaces them on the dashboard.
    model: sonnet
    skip_permissions: true
    timeout: 1200
    enabled: true
    tags:
      - weekly
      - meta
      - research
  setup-health:
    name: Setup Health Audit — Weekly ~/.claude Rot Check
    schedule: 0 9 * * 1
    directory: /Users/akorinek/Programming
    prompt: |
      Read ~/.claude/skills/setup-health/SKILL.md and follow it exactly, in SCHEDULED mode.
      - Run all Phase 1 deterministic checks and Phase 2 usage-based checks.
      - Write the dated report to ~/.claude/health/health-YYYY-MM-DD.md and refresh latest.md.
      - REPORT ONLY — do not uninstall, disable, or edit any plugin/skill/rule.
      - End your output with exactly one status line for easy notification:
        "SETUP-HEALTH: P1 FOUND — <n> issue(s)" if any P1 exists, otherwise
        "SETUP-HEALTH: CLEAN — P2/P3 only (<n>)".
    model: sonnet
    skip_permissions: true
    timeout: 600
    enabled: true
    tags:
      - weekly
      - meta
      - health
  autopilot-daily:
    name: Autopilot Daily - Triage MBNXT and Ship One Ticket
    schedule: 30 9 * * 1-5
    directory: /Users/akorinek/Programming/autopilot-daily
    type: script
    command: bash /Users/akorinek/Programming/autopilot-daily/scripts/run-daily.sh
    timeout: 7200
    max_retries: 0
    enabled: true
    tags:
      - daily
      - autopilot
  speedboat-cycle-cron:
    name: Speedboat Check-in - Daily Cycle Gate (kickoff / chase)
    # Daily INCLUDING weekends: chase-pre can land on a Saturday (run 2's is
    # Sat 29 Aug). The gate makes almost every run a cheap no-op; kickoff fires
    # only while the backend still sits on the previous cycle, so a missed or
    # failed day self-heals the next morning (go-live Gate 2.5, and
    # docs/run-schedule.md in the repo).
    schedule: 45 8 * * *
    directory: /Users/akorinek/Programming/speedboat-checkin
    type: script
    command: bash /Users/akorinek/Programming/speedboat-checkin/scripts/cycle-cron.sh
    # Kickoff resolves the Echelon roster and creates ~50 Asana tasks headless.
    timeout: 3600
    enabled: true
    tags:
      - daily
      - speedboat-checkin
  autopilot-reconcile:
    name: Autopilot Reconcile - Sync Ticket States With PR Outcomes
    schedule: 15 6-22 * * 1-5
    directory: /Users/akorinek/Programming/autopilot-daily
    type: script
    command: bash /Users/akorinek/Programming/autopilot-daily/scripts/run-reconcile.sh
    timeout: 300
    max_retries: 0
    enabled: true
    tags:
      - hourly
      - autopilot

  answer-pr-comments:
    name: Answer PR Comments - Conversation Pass
    schedule: 30 6-22 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      ## FIRST, BEFORE ANYTHING ELSE: check the autopilot-daily lock

      Run: `cat ~/.autopilot-daily.lock 2>/dev/null`

      If that file exists AND its `startedAt` epoch-milliseconds value is less
      than 120 minutes old, the autopilot-daily job is mid-run and holds the
      machine. In that case print exactly:
        "Deferred - autopilot-daily holds the lock"
      and STOP immediately. Do not call any other tool. You will run again next hour.

      If the file is absent, unparseable, or older than 120 minutes, proceed.

      ## Conversation pass

      Run EXACTLY this, with NO arguments. It is batch-scoped across every
      configured repo, plus every PR you have already engaged with in any other
      repo (reach discovery). Never pass --pr and never run it once per PR:

        bash ~/.claude/skills/pr-review/scripts/conversation-preflight.sh

      Read its "CONVERSATION_PENDING:" line and open the file named on its
      "CONVERSATION_RESULT_FILE:" line with jq. NEVER read the pending items from
      the "CONVERSATION_RESULT_JSON:" line: the tool output is truncated at about
      2,000 characters and that line is routinely 30,000. On 2026-09-28 it hid 11
      of 12 pending items and the run reported them as already resolved.

      - pending EMPTY (CONVERSATION_PENDING: 0) and no verdict_state entry with
        block_lift_eligible true -> print the script's CONV and VERDICT lines and
        STOP. This is the expected outcome of most runs.
      - otherwise -> follow
        ~/.claude/skills/pr-review/references/conversation-pass.md EXACTLY for
        EVERY item in the file, with --auto behavior, and end your summary with
        "acted on N of N". That reference is self-contained; do NOT read SKILL.md.
      - exit code 2 -> a host was unreachable. Name WHICH host in your summary,
        then continue with whatever items were emitted.
      - a SCOPE_STATUS line other than ok / refreshed -> say so in your summary.
        While the scope is on, only PRs carrying the SEO label, Echelon-team PRs
        where my review was requested, and team PRs that mention me are scanned;
        that is expected, not an error.

      This job answers people. It posts thread replies, thread resolutions with a
      recorded basis, and at most one review dismissal per PR. It NEVER reviews
      code and NEVER posts APPROVE, COMMENT, or REQUEST_CHANGES - verdicts belong
      to the babysit-prs job.

      ## CRITICAL: host -> username mapping
      | Host | My username |
      |---|---|
      | github.com | akorinek-grpn |
      | github.groupondev.com | akorinek |
    model: sonnet
    skip_permissions: true
    timeout: 1800
    max_retries: 0 # hourly: the next run covers a failure; immediate retries only repeat an outage
    enabled: true
    tags:
      - hourly
      - pr-review

  approve-prs:
    name: Approve PRs — Converged Re-Reviews (opus)
    schedule: 40 6-22 * * 1-5
    directory: /Users/akorinek/Programming/ai-scheduler
    prompt: |
      ## FIRST, BEFORE ANYTHING ELSE: check the autopilot-daily lock

      Run: `cat ~/.autopilot-daily.lock 2>/dev/null`

      If that file exists AND its `startedAt` epoch-milliseconds value is less
      than 120 minutes old, the autopilot-daily job is mid-run and holds the
      machine. In that case print exactly:
        "Deferred - autopilot-daily holds the lock"
      and STOP immediately. Do not review any PRs, do not call any other tool.
      You will run again next hour.

      If the file is absent, unparseable, or older than 120 minutes, ignore it and
      proceed normally with the review work below.

      ## What this job is

      The approving job. Only `converged` and `converged-static` candidates reach
      it: pull requests where every blocking finding this reviewer raised was
      resolved by this reviewer on code evidence. Every other reason belongs to
      babysit-prs. This is the ONLY job that may post APPROVE on a converged PR,
      and it runs on opus for that reason: sonnet may find, only opus may approve.
      It runs at :40, ten minutes after the :30 conversation pass that creates
      convergence.

      STEP 1 - run the deterministic preflight gate. Your FIRST action is:

        bash ~/.claude/skills/pr-review/scripts/batch-preflight.sh --role approve

      It performs per-host auth checks, PR discovery, the full decision ladder,
      budget selection (filtered to this job's reasons), and writes the batch
      decision telemetry itself. Read its "PREFLIGHT_CANDIDATES:" line, and take the
      candidates from the file named on its "PREFLIGHT_RESULT_FILE:" line
      (jq '.candidates' FILE) - never from the "PREFLIGHT_RESULT_JSON:" line, which
      the tool output truncates at ~2,000 chars:

      - candidates EMPTY (PREFLIGHT_CANDIDATES: 0) -> print the script's decision
        lines and summary as your run output and STOP. Do NOT read SKILL.md, do NOT
        call any other tool. This is the expected outcome of most runs.
      - candidates NON-EMPTY -> proceed to STEP 2 for exactly those PRs. Pass each
        candidate's author_in_team to the gate exactly as the file gives it.
      - exit code 2 -> a host was unreachable/unauthenticated. Say WHICH host
        prominently in your summary (this must never look like "no PRs found"),
        then still process any candidates that were emitted.
      - a SCOPE_STATUS line other than ok / refreshed -> say so prominently in your
        summary (the Echelon team roster could not be refreshed).

      STEP 2 - review the preflight candidates by following
      ~/.claude/skills/pr-review/SKILL.md EXACTLY, in scheduled/batch mode with
      --auto behavior, starting at Step 0.5 (discovery and the decision ladder
      already ran in preflight - do not re-derive or second-guess skip
      decisions). A `converged` candidate is a delta re-review with specialists
      dispatched as subagents (Step 4 hard gate) and the basis ledger pre-marking
      addressed findings (Step 3); a `converged-static` candidate is Step 0.5V.
      Either way the verdict comes from scripts/approve-gate.sh (Step 8): run it,
      dispatch the architect (Role 6) when it asks, post exactly the event it
      returns - `null` means post nothing and record the converged-shadow-skip
      decision. The skill is the single source of truth for the trivial-delta
      fast path, pagination discipline (--paginate on every reviews/comments
      list call), the posting contract, the gate, and telemetry (schema v2
      per-PR files with `job: "approve-prs"`, AND appending to the
      {date}-batch.json runs[] decision log).

      ## CRITICAL: host -> username mapping (identity only; all logic lives in the skill)
      | Host | My username (self-review filter AND prior-review filter) |
      |---|---|
      | github.com | akorinek-grpn |
      | github.groupondev.com | akorinek |

      These are DIFFERENT accounts. For every `select(.user.login == ...)` filter,
      pick the login from this table by the repo's host. Using the wrong one
      silently returns zero hits and causes duplicate reviews on the same HEAD
      (groupon/echelon#285, 2026-04-16).

      ## Job-runner specifics (things the skill does not cover)
      - If a github.groupondev.com call fails to connect, retry once after 15s.
        Still failing: log "GHE unreachable - skipped <repo>" in the summary and
        continue with the remaining repos; do NOT fail the whole run.
      - Do not invoke unrelated skills (hello, session bootstrap, reporting,
        etc.) - go straight to the review work.
      - If a single PR review fails, log the error and continue to the next PR.
      - If there are no candidates, report "No converged PRs to approve".
      - ALWAYS print the per-PR decision lines and the batch summary table from
        the skill's batch-mode section, even when everything is skipped.
    model: opus
    skip_permissions: true
    # Same envelope as babysit-prs: a converged re-review dispatches five specialists
    # plus the architect. Hourly schedule + no-overlap guard bound a long run.
    timeout: 3600
    max_retries: 0 # hourly: the next run covers a failure; immediate retries only repeat an outage
    enabled: true
    tags:
